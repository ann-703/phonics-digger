<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Counting Digger</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='14' width='20' height='10' rx='2' fill='%23F5A623'/><rect x='12' y='8' width='10' height='9' rx='2' fill='%23F5A623'/><rect x='13' y='10' width='7' height='5' rx='1' fill='%23AEE4FF'/><line x1='21' y1='10' x2='29' y2='6' stroke='%23E8941A' stroke-width='2.5' stroke-linecap='round'/><polygon points='27,4 31,4 30,9 26,9' fill='%23D4800A'/><circle cx='6' cy='25' r='4' fill='%23333'/><circle cx='6' cy='25' r='2' fill='%23555'/><circle cx='18' cy='25' r='4' fill='%23333'/><circle cx='18' cy='25' r='2' fill='%23555'/><rect x='2' y='23' width='20' height='3' rx='1.5' fill='%23222'/></svg>">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Child-proof: nothing is tappable unless we say so */
    #scene, #rock-field, #digger-zone, #dirt-puffs, #divots {
      pointer-events: none;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Deep dirt on this page — the rocks need ground to sit in */
    #ground { height: 52vh; }

    /* ---- Rock field: the dirt on the left ---- */
    #rock-field {
      position: fixed;
      left: 0; top: 42vh;
      width: 54vw; height: 52vh;
      z-index: 20;
    }

    #divots {
      position: fixed;
      left: 0; top: 42vh;
      width: 54vw; height: 52vh;
      z-index: 18;
    }

    .divot {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 35%, #4A340B 0%, #6B4F10 70%, rgba(107,79,16,0) 100%);
      opacity: 0;
      transform: translate(-50%, -50%);
    }

    .rock {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 5px 6px rgba(0,0,0,0.35));
      transition: filter 0.15s ease;
    }

    .rock svg { width: 100%; height: 100%; display: block; }

    .rock:active { filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35)) brightness(1.15); }

    /* Rocks left over once the target is reached */
    .rock.locked {
      opacity: 0.35;
      pointer-events: none;
      filter: none;
    }

    /* Rock mid-flight, or already delivered */
    .rock.flying { pointer-events: none; z-index: 45; }
    .rock.spent  { display: none; }

    /* ---- Digger zone (right half) ---- */
    #digger-zone {
      position: fixed;
      right: 2vw;
      bottom: 8vh;
      z-index: 22;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* Skip on the left, digger on the right reaching over it */
    #digger-row {
      display: flex;
      align-items: flex-end;
      gap: 0;
    }

    /* The target number, big, on a sign above the digger */
    #target-sign {
      background: #FFF9E6;
      border: 6px solid #00BCD4;
      border-radius: 24px;
      box-shadow: 0 8px 0 #00838F, 0 12px 28px rgba(0,0,0,0.25);
      padding: 4px 44px 10px;
      min-width: 150px;
      text-align: center;
    }

    #target-number {
      font-size: 96px;
      font-weight: 900;
      line-height: 1.05;
      color: #00838F;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
    }

    #target-caption {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #00838F;
      opacity: 0.75;
    }

    /* Bucket that fills with rocks */
    #bucket {
      width: 210px;
      height: 118px;
      border: 8px solid #D4800A;
      border-top: none;
      border-radius: 0 0 14px 14px;
      background: linear-gradient(180deg, rgba(232,148,26,0.22) 0%, rgba(212,128,10,0.5) 100%);
      box-shadow: inset 0 -6px 12px rgba(0,0,0,0.2), 0 6px 14px rgba(0,0,0,0.28);
      position: relative;
      overflow: hidden;
      margin-right: -14px;   /* tuck under the digger's boom */
      margin-bottom: 6px;    /* rest on the dirt */
    }

    .bucket-rock {
      position: absolute;
      width: 40px;
      height: 34px;
      transform: translate(-50%, -50%) scale(0);
    }

    .bucket-rock svg { width: 100%; height: 100%; display: block; }

    #counting-digger {
      width: 300px; height: 200px;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.3));
      transform: scaleX(-1);   /* arm reaches left, toward the skip */
    }
    #counting-digger svg { width: 100%; height: 100%; }

    /* ---- Parent setup ---- */
    #setup-btn-corner {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      background: rgba(0,0,0,0.28);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-tap-highlight-color: transparent;
    }

    #count-setup {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #87CEEB 0%, #B0E0FF 60%, #8B6914 100%);
    }

    #count-setup.hidden { display: none; }

    #setup-card {
      background: #FFF9E6;
      border: 5px solid #00BCD4;
      border-radius: 28px;
      box-shadow: 0 10px 0 #00838F, 0 16px 40px rgba(0,0,0,0.22);
      padding: 32px 30px 28px;
      max-width: 500px;
      width: 92vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #setup-card h2 { font-size: 24px; font-weight: 900; color: #333; text-align: center; line-height: 1.3; }
    #setup-card p  { font-size: 15px; color: #666; text-align: center; }

    #count-setup, #setup-card, #setup-card * { pointer-events: auto; touch-action: auto; }

    #range-row { display: flex; gap: 12px; width: 100%; }

    .range-btn {
      flex: 1;
      padding: 18px 8px;
      font-size: 20px;
      font-weight: 900;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
      background: #fff;
      color: #00838F;
      border: 4px solid #00BCD4;
      border-radius: 18px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s;
    }

    .range-btn:active { transform: translateY(3px); }
    .range-btn.selected { background: #00BCD4; color: #fff; box-shadow: 0 5px 0 #00838F; }

    #divider { font-size: 14px; color: #999; font-weight: 700; }

    #count-input {
      width: 100%;
      font-size: 22px;
      font-weight: 700;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
      padding: 14px 16px;
      border: 4px solid #00BCD4;
      border-radius: 16px;
      background: #fff;
      color: #333;
      outline: none;
      text-align: center;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
      -webkit-user-select: text !important;
      user-select: text !important;
      -webkit-touch-callout: default !important;
    }

    #count-input:focus { border-color: #F5A623; box-shadow: 0 0 0 3px rgba(245,166,35,0.25); }

    #setup-error { font-size: 14px; color: #E53935; font-weight: 700; min-height: 18px; text-align: center; }

    #start-btn {
      width: 100%;
      padding: 18px;
      font-size: 24px;
      font-weight: 900;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
      background: #00BCD4;
      color: #fff;
      border: 4px solid #00838F;
      border-radius: 20px;
      box-shadow: 0 7px 0 #006064, 0 10px 24px rgba(0,0,0,0.2);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    #start-btn:active { transform: translateY(4px); box-shadow: 0 3px 0 #006064; }

    /* ---- Responsive ---- */
    @media (max-width: 900px) {
      #counting-digger { width: 210px; height: 140px; }
      #bucket { width: 165px; height: 96px; }
      #target-number { font-size: 68px; }
      #target-sign { padding: 4px 28px 8px; min-width: 112px; }
      .bucket-rock { width: 32px; height: 27px; }
    }

    @media (max-height: 560px) {
      #counting-digger { width: 175px; height: 117px; }
      #bucket { width: 150px; height: 78px; }
      #target-number { font-size: 54px; }
      #digger-zone { gap: 6px; }
      .bucket-rock { width: 28px; height: 24px; }
    }
  </style>
</head>
<body>

  <a href="index.html" id="home-btn">⌂ Home</a>
  <button id="setup-btn-corner" aria-label="Change numbers">⚙</button>

  <div id="scene">
    <div id="sky"></div>
    <div id="ground"></div>
  </div>

  <!-- Holes left behind by rocks that have been sent -->
  <div id="divots"></div>

  <!-- Rocks injected by counting.js -->
  <div id="rock-field"></div>

  <div id="digger-zone">
    <div id="target-sign">
      <div id="target-number">3</div>
      <div id="target-caption">ROCKS PLEASE</div>
    </div>

    <div id="digger-row">
      <div id="bucket"></div>

      <div id="counting-digger">
      <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="30" width="70" height="30" rx="6" fill="#F5A623"/>
        <rect x="45" y="15" width="35" height="25" rx="4" fill="#F5A623"/>
        <rect x="50" y="19" width="25" height="15" rx="3" fill="#AEE4FF" opacity="0.85"/>
        <rect x="78" y="22" width="12" height="8" rx="2" fill="#E8941A"/>
        <line x1="84" y1="26" x2="108" y2="18" stroke="#E8941A" stroke-width="6" stroke-linecap="round"/>
        <polygon points="104,14 114,14 110,26 100,26" fill="#D4800A"/>
        <rect x="46" y="8" width="5" height="9" rx="2" fill="#333"/>
        <circle cx="22" cy="62" r="11" fill="#333"/>
        <circle cx="22" cy="62" r="6" fill="#555"/>
        <circle cx="22" cy="62" r="2" fill="#888"/>
        <circle cx="62" cy="62" r="11" fill="#333"/>
        <circle cx="62" cy="62" r="6" fill="#555"/>
        <circle cx="62" cy="62" r="2" fill="#888"/>
        <rect x="10" y="58" width="72" height="8" rx="4" fill="#222"/>
      </svg>
      </div>
    </div>
  </div>

  <div id="dirt-puffs"></div>

  <!-- Celebration when the bucket holds the target number -->
  <div id="celebration" aria-hidden="true">
    <svg id="big-digger" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="30" width="70" height="30" rx="6" fill="#F5A623"/>
      <rect x="45" y="15" width="35" height="25" rx="4" fill="#F5A623"/>
      <rect x="50" y="19" width="25" height="15" rx="3" fill="#AEE4FF" opacity="0.85"/>
      <rect x="78" y="22" width="12" height="8" rx="2" fill="#E8941A"/>
      <line x1="84" y1="26" x2="108" y2="18" stroke="#E8941A" stroke-width="6" stroke-linecap="round"/>
      <polygon points="104,14 114,14 110,26 100,26" fill="#D4800A"/>
      <rect x="46" y="8" width="5" height="9" rx="2" fill="#333"/>
      <circle cx="22" cy="62" r="11" fill="#333"/>
      <circle cx="22" cy="62" r="6" fill="#555"/>
      <circle cx="22" cy="62" r="2" fill="#888"/>
      <circle cx="62" cy="62" r="11" fill="#333"/>
      <circle cx="62" cy="62" r="6" fill="#555"/>
      <circle cx="62" cy="62" r="2" fill="#888"/>
      <rect x="10" y="58" width="72" height="8" rx="4" fill="#222"/>
    </svg>
    <div id="celebration-text">THAT'S 3!</div>
  </div>

  <div id="confetti-container" aria-hidden="true"></div>
  <div id="stars-container"    aria-hidden="true"></div>

  <!-- Parent setup -->
  <div id="count-setup">
    <div id="setup-card">
      <div style="font-size:44px;line-height:1">🪨🚜</div>
      <h2>How high shall we count today?</h2>
      <div id="range-row">
        <button class="range-btn" data-max="3">up to 3</button>
        <button class="range-btn selected" data-max="5">up to 5</button>
        <button class="range-btn" data-max="10">up to 10</button>
      </div>
      <div id="divider">— or drill specific numbers —</div>
      <input
        id="count-input"
        type="text"
        inputmode="numeric"
        placeholder="2, 5, 3"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      >
      <div id="setup-error"></div>
      <button id="start-btn">Let's Count! 🚜</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="celebrate.js"></script>
  <script src="counting.js"></script>
</body>
</html>
