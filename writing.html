<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Writing Digger</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    #writing-stage {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3vw;
      padding: 56px 2vw 110px;
    }

    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .panel-label {
      font-size: 20px;
      font-weight: 900;
      color: #1a1a2e;
      text-shadow: 0 2px 8px rgba(255,255,255,0.85);
      letter-spacing: 1px;
    }

    .panel-box {
      /* Sized against actual chrome (padding + label + button row) rather
         than a flat vh guess, so it fills the space without overflowing
         past the ground/digger on short landscape windows. */
      width: min(42vw, calc(100vh - 290px), 520px);
      height: min(42vw, calc(100vh - 290px), 520px);
      flex: 0 1 auto;
      background: rgba(255,255,255,0.9);
      border-radius: 24px;
      border: 5px solid #FF6B35;
      box-shadow: 0 8px 0 #C8501E, 0 12px 28px rgba(0,0,0,0.2);
      overflow: hidden;
      position: relative;
    }

    #dirt-box {
      /* Bright reveal color lives here, behind the canvas — erasing the
         dirt on the canvas exposes this rather than the page background. */
      background: #4CAF50;
    }

    #guide-svg, #dirt-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    #action-row {
      display: flex;
      gap: 14px;
    }

    #action-row button {
      padding: 12px 22px;
      font-size: 17px;
      font-weight: 900;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
      color: #fff;
      border-radius: 18px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #action-row button:active {
      transform: translateY(3px);
    }

    #refill-btn {
      background: #7C4DFF;
      border: 4px solid #512DA8;
      box-shadow: 0 6px 0 #4527A0, 0 8px 20px rgba(0,0,0,0.2);
    }
    #refill-btn:active { box-shadow: 0 3px 0 #4527A0, 0 4px 10px rgba(0,0,0,0.15); }

    #next-btn {
      background: #4CAF50;
      border: 4px solid #2E7D32;
      box-shadow: 0 6px 0 #1B5E20, 0 8px 20px rgba(0,0,0,0.2);
    }
    #next-btn:active { box-shadow: 0 3px 0 #1B5E20, 0 4px 10px rgba(0,0,0,0.15); }

    #writing-digger {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      width: 130px;
      height: 87px;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.3));
      pointer-events: none;
    }

    @media (max-width: 760px) {
      #writing-stage { flex-direction: column; gap: 10px; padding: 52px 4vw 110px; }
      .panel-box { width: min(78vw, calc(50vh - 165px), 320px); height: min(78vw, calc(50vh - 165px), 320px); }
      .panel-label { font-size: 17px; }
    }
  </style>
</head>
<body>

  <a href="index.html" id="home-btn">⌂ Home</a>

  <div id="scene">
    <div id="sky"></div>
    <div id="ground"></div>
  </div>

  <div id="writing-stage">

    <div class="panel">
      <div class="panel-label" id="shape-label">Straight Line</div>
      <div class="panel-box">
        <svg id="guide-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>

    <div class="panel">
      <div class="panel-label">Dig It Out</div>
      <div class="panel-box" id="dirt-box">
        <canvas id="dirt-canvas" width="900" height="900"></canvas>
      </div>
      <div id="action-row">
        <button id="refill-btn">🔄 Refill Dirt</button>
        <button id="next-btn">Next Shape ▶</button>
      </div>
    </div>

  </div>

  <svg id="writing-digger" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="30" width="70" height="30" rx="6" fill="#F5A623"/>
    <rect x="45" y="15" width="35" height="25" rx="4" fill="#F5A623"/>
    <rect x="50" y="19" width="25" height="15" rx="3" fill="#AEE4FF" opacity="0.85"/>
    <rect x="78" y="22" width="12" height="8" rx="2" fill="#E8941A"/>
    <line x1="84" y1="26" x2="108" y2="18" stroke="#E8941A" stroke-width="6" stroke-linecap="round"/>
    <polygon points="104,14 114,14 110,26 100,26" fill="#D4800A"/>
    <rect x="46" y="8" width="5" height="9" rx="2" fill="#333"/>
    <circle cx="22" cy="62" r="11" fill="#333"/>
    <circle cx="22" cy="62" r="6" fill="#555"/>
    <circle cx="22" cy="62" r="2" fill="#888"/>
    <circle cx="62" cy="62" r="11" fill="#333"/>
    <circle cx="62" cy="62" r="6" fill="#555"/>
    <circle cx="62" cy="62" r="2" fill="#888"/>
    <rect x="10" y="58" width="72" height="8" rx="4" fill="#222"/>
  </svg>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="writing.js"></script>
</body>
</html>
